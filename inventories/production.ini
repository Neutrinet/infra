[all]
# Machines physiques
#
# Topi, Nam et Bour - Proxmox
#
# 3 x Dell PowerEdge R620 avec chacun 2 x Xeon E5-2640 0 @ 2.50GHz - 128Gb RAM
# Chacun dispose de 2 SSD Samsung 870 EVO 250GB en raid1 pour le système
# Chacun dispose de 2 disques SAS de 900Gb en raid0 pour les backups
# Chacun dispose de 2 SSD Samsung 870 EVO 1TB pour le ceph
# Chacun dispose de 4 ports RJ45 et 1 interface iDrac
# Chacun dispose de 1 carte fibre optique avec 2 ports SFP+ (pour le cluster ceph)
# Chacun dispose de deux alimentations

