postgresql_patroni_name: neutrinet-patroni

postgresql_patroni_clients:
  - "2001:913:1000:11::11/128"
  - "2001:913:1000:11::12/128"

postgresql_patroni_replication_username: replicator
postgresql_patroni_replication_password: "{{ vault_postgresql_patroni_replication_password }}"
postgresql_patroni_rewind_username: rewind
postgresql_patroni_rewind_password: "{{ vault_postgresql_patroni_rewind_password }}"

postgresql_patroni_shared_buffers: 2GB
postgresql_patroni_effective_cache_size: 6GB
postgresql_patroni_work_mem: 16MB
postgresql_patroni_maintenance_work_mem: 256MB

etcd_name: neutrinet-patroni
etcd_data_dir: "/var/lib/etcd/neutrinet-patroni"
etcd_members:
  - name: "pgsql-01"
    ipv6: "2001:913:1000:11::21"
  - name: "pgsql-02"
    ipv6: "2001:913:1000:11::22"
  - name: "pgsql-03"
    ipv6: "2001:913:1000:11::23"
