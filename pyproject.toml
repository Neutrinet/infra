[project]
name = "infra-ansible"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Neutrinet", email = "hub-infra@neutrinet.be"},
]
dependencies = [
    "ansible~=12.0",
    "ansible-core~=2.19",
    "ansible-lint~=26.4",
    "molecule~=26.3.0",
    "molecule-plugins[vagrant]~=25.8",
    "pre-commit~=4.5",
    "python-vagrant~=1.0.0",
    "mitogen~=0.3",
    "passlib~=1.7.4",
    "dnspython~=2.8.0",
]
requires-python = "==3.13.*"
readme = "README.md"
license = {text = "AGPL"}

[tool.pdm.venv]
in_project = true

[tool.pdm]
distribution = false
