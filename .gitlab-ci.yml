workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.venv"
  PRE_COMMIT_HOME: "${CI_PROJECT_DIR}/.cache/pre-commit"
  FF_USE_FASTZIP: "true"

stages:
  - quality

.linting:
  image: python:3.13
  stage: quality
  before_script:
    - chmod o= -R . # This is needed because somehow the repository is world-writable and ansible doesn't like that
    - echo "fake_password" > vault.key # Create fake vault password file otherwise ansible-lint will panic
    - |
      if [[ ! -d .venv ]]; then
        python3 -m venv .venv
      fi
    - source .venv/bin/activate
    - pip install -r requirements.txt -U
  cache:
    key:
      files:
        - .pre-commit-config.yaml
        - requirements.txt
    paths:
      - ${PRE_COMMIT_HOME}
      - ${PIP_CACHE_DIR}
    policy: pull-push
  interruptible: true

linting shallow:
  extends: .linting
  script:
    - pre-commit run --color always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

linting full:
  extends: .linting
  script:
    - pre-commit run --all-files --color always
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  needs:
    - job: linting shallow
      optional: true
