workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  PIP_CACHE_DIR: /cache/pip
  PRE_COMMIT_HOME: /cache/pre-commit
  VIRTUAL_ENV: /cache/venv

stages:
  - quality

.linting:
  image: python:3.13
  stage: quality
  before_script:
    - chmod o= -R . # This is needed because somehow the repository is world-writable and ansible doesn't like that
    - echo "fake_password" > vault.key # Create fake vault password file otherwise ansible-lint will panic
    - |
      if [[ ! -d "${VIRTUAL_ENV}" ]]; then
        python3 -m venv "${VIRTUAL_ENV}"
      fi
    - source "${VIRTUAL_ENV}/bin/activate"
    - pip install -r requirements.txt -U
  interruptible: true

linting on changes:
  extends: .linting
  script:
    - pre-commit run --color always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

linting full:
  extends: .linting
  script:
    - pre-commit run --all-files --color always
    - pre-commit run --all-files --color always --hook-stage manual gitleaks-tree
  rules:
    # Run full linting anytime except in draft MR
    - if: $CI_PIPELINE_SOURCE != "merge_request_event" || $CI_MERGE_REQUEST_DRAFT == "false"
    # Allow manual trigger of full linting in draft MR
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"
      when: manual
  needs:
    - job: linting on changes
      optional: true
