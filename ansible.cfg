[ssh_connection]
pipelining=True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=3600s -o UserKnownHostsFile=/dev/null

[defaults]
strategy_plugins = plugins/strategy/mitogen/ansible_mitogen/plugins/strategy
strategy = mitogen_linear

display_skipped_hosts = False
roles_path=./roles
retry_files_enabled = False
host_key_checking = False
interpreter_python = /usr/bin/python3
inventory = inventories/production.ini

gathering = smart
fact_caching_timeout = 86400
fact_caching = yaml
fact_caching_connection = .facts_cache
forks=25

vault_password_file = vault.key

stdout_callback = yaml
callbacks_enabled = log_plays

[callback_log_plays]
log_folder = ./log

[passwordstore_lookup]
backend = gopass
