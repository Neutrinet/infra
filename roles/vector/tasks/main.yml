---
- name: Suppression de l'ancien dépôt APT pour Vector
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/vector.list
    state: absent

- name: Ajout du dépôt APT pour Vector
  ansible.builtin.deb822_repository:
    name: vector
    types: deb
    signed_by: https://keys.datadoghq.com/DATADOG_APT_KEY_C0962C7D.public
    uris: https://apt.vector.dev
    suites: stable
    components:
      - vector-0
    state: present
  notify: Update apt cache

- name: Installation de Vector
  ansible.builtin.package:
    name: vector
    state: present

- name: Créer du dossier pour systemd
  ansible.builtin.file:
    path: "/etc/systemd/system/vector.service.d"
    state: directory
    owner: root
    group: root
    mode: u=Xrw,go=Xr

- name: Config vector pour utiliser un dossier de configuration
  ansible.builtin.template:
    src: systemd/override.conf.j2
    dest: /etc/systemd/system/vector.service.d/override.conf
    owner: root
    group: root
    mode: "ugo=r"
  notify:
    - Reload systemd
    - Restart vector

- name: Créer des dossier pour vector
  ansible.builtin.file:
    path: "/etc/vector/{{ item }}"
    state: directory
    owner: vector
    group: vector
    mode: ug=Xr,o=
  loop:
    - sources
    - transforms
    - sinks

- name: Copie des plugins globaux de Vector
  ansible.builtin.template:
    src: vector/{{ item }}.j2
    dest: /etc/vector/{{ item }}
    owner: vector
    group: vector
    mode: "ug=r,o="
  loop:
    - vector.yaml
    - sinks/localhost.yaml
    - sinks/victoriametrics.yaml
    - sources/prometheus_static_heartbeat.yaml
    - transforms/common_labels.yaml
  notify: Restart vector
  tags: ['vector_config']

- name: Activation de Vector au démarrage
  ansible.builtin.systemd:
    name: vector
    state: started
    enabled: true
    daemon_reload: true
