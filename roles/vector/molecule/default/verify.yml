---
- name: Verify
  hosts: all
  become: true

  tasks:
    - name: Récupération de l'état des services
      ansible.builtin.service_facts:

    - name: Vérification que vector est actif et activé au démarrage
      ansible.builtin.assert:
        that:
          - ansible_facts.services['vector.service'].state == 'running'
          - ansible_facts.services['vector.service'].status == 'enabled'

    - name: Vérification des métriques remontées par Vector
      ansible.builtin.uri:
        url: http://localhost:9598/metrics
        return_content: true
      register: _verify_vector
      retries: 12
      delay: 10
      until: "_verify_vector.status == 200 and 'static_heartbeat' in _verify_vector.content"
