- name: Suppression de l'ancien dépôt de Docker
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Ajout du dépôt APT pour Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    signed_by: https://download.docker.com/linux/debian/gpg
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_distribution_release | lower }}"
    components:
      - stable
    state: present
  notify: Update apt cache

- name: Trigger handlers
  ansible.builtin.meta: flush_handlers

- name: Installation de Docker
  ansible.builtin.package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present

- name: Installation des dépendances python
  ansible.builtin.package:
    name: python3-docker
    state: present

- name: Configuration de Docker
  ansible.builtin.copy:
    src: docker/daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "u=rw,go=r"
  notify: Restart docker

- name: Activation de Docker au démarrage
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Création d'un cron job pour nettoyer les images docker chaque semaine
  ansible.builtin.cron:
    name: docker-prune
    cron_file: docker-prune
    state: present
    special_time: weekly
    user: root
    job: docker system prune -af --filter "until=$((30*24))h" > /dev/null

- name: Trigger docker handler
  ansible.builtin.meta: flush_handlers

- name: Ajouts de l'utilisateur telegraf au group docker
  ansible.builtin.user:
    name: telegraf
    groups: docker
    append: true
  notify: Restart telegraf
  tags: ["telegraf_config"]

- name: Installation des plugins Telegraf
  ansible.builtin.template:
    src: telegraf/docker.conf.j2
    dest: /etc/telegraf/telegraf.d/docker.conf
    owner: telegraf
    group: telegraf
    mode: "u=rw,g=r,o="
    validate: telegraf --config %s --test
  notify: Restart telegraf
  tags: ["telegraf_config"]

- name: Configuration des backups Borgmatic
  ansible.builtin.template:
    src: borgmatic/docker.yml.j2
    dest: /etc/borgmatic.d/docker.yml
    owner: root
    group: root
    mode: "u=rw,go="
    validate: borgmatic config validate --show -c %s
  tags: ["borgmatic_config"]
