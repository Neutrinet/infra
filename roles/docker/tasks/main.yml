- name: Suppression de l'ancien dépôt de Docker
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Ajout du dépôt APT pour Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    signed_by: https://download.docker.com/linux/debian/gpg
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] | lower }}"
    components:
      - stable
    state: present
  notify: Update apt cache

- name: Trigger handlers
  ansible.builtin.meta: flush_handlers

- name: Installation de Docker
  ansible.builtin.package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present

- name: Installation des dépendances python
  ansible.builtin.package:
    name: python3-docker
    state: present

- name: Configuration de Docker
  ansible.builtin.copy:
    src: docker/daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "u=rw,go=r"
  notify: Restart docker

- name: Activation de Docker au démarrage
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Suppression du cron job de nettoyage des images docker
  ansible.builtin.cron:
    name: docker-prune
    cron_file: docker-prune
    state: absent

- name: Trigger docker handler
  ansible.builtin.meta: flush_handlers

- name: Configuration des backups Borgmatic
  ansible.builtin.template:
    src: borgmatic/docker.yml.j2
    dest: /etc/borgmatic.d/docker.yml
    owner: root
    group: root
    mode: "u=rw,go="
    validate: borgmatic config validate --show -c %s
  tags: ["borgmatic_config"]
