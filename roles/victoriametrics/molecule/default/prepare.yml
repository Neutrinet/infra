---
- name: Prepare
  hosts: all
  become: true

  pre_tasks:
    - name: Mise à jour du cache APT
      ansible.builtin.apt:
        update_cache: true

    - name: Installation des outils utilisés par les hooks borgmatic
      ansible.builtin.package:
        name:
          - curl
          - jq
        state: present

  roles:
    - vector
    - borgmatic
