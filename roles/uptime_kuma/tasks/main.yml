---
- name: Installation de NodeJS
  ansible.builtin.import_role:
    name: nodejs
  vars:
    nodejs_major_version: 22
  tags: ['nodejs']

- name: Création de l'utilisateur
  ansible.builtin.import_tasks: user.yml
  tags: ['user']

- name: Installation de Uptime-Kuma
  ansible.builtin.import_tasks: uptime_kuma.yml
  tags: ['uptime_kuma']

- name: Configuration de vector
  ansible.builtin.template:
    src: vector/prometheus_uptime_kuma_exporter.yaml.j2
    dest: /etc/vector/sources/prometheus_uptime_kuma_exporter.yaml
    owner: vector
    group: vector
    mode: "ug=r,o="
  notify: Restart vector
  tags: ['vector_config']

- name: Configuration des backups Borgmatic
  ansible.builtin.template:
    src: borgmatic/uptime-kuma.yml.j2
    dest: /etc/borgmatic.d/uptime-kuma-{{ uptime_kuma_owner }}.yml
    owner: root
    group: root
    mode: "u=rw,go="
    validate: borgmatic config validate --show -c %s
  tags: ['borgmatic_config']
