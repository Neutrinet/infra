---
- name: Verify
  hosts: all
  become: true

  tasks:
    - name: Récupération de l'état des services
      ansible.builtin.service_facts:

    - name: Vérification que PHP-FPM exporter est actif
      ansible.builtin.assert:
        that:
          - ansible_facts.services | dict2items | selectattr('key', 'match', 'php-fpm-exporter@') | selectattr('value.state', 'equalto', 'running') | list | length == 1

    - name: Vérification de http://localhost:9254/metrics
      ansible.builtin.uri:
        url: http://localhost:9254/metrics
        return_content: true
      register: _verify_endpoint_0
      retries: 6
      delay: 10
      until: "_verify_endpoint_0.status == 200 and 'phpfpm_up{' in _verify_endpoint_0.content"

    - name: Vérification des métriques remontées par Vector
      ansible.builtin.uri:
        url: http://localhost:9598/metrics
        return_content: true
      register: _verify_vector
      retries: 12
      delay: 10
      until: "_verify_vector.status == 200 and 'phpfpm_up' in _verify_vector.content"
