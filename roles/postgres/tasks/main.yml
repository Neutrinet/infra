---
- name: Installation des ACL
  ansible.builtin.package:
    name: acl
    state: present
  tags: ["postgresql_install"]

- name: Suppression de l'ancien dépôt APT pour PostgreSQL
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/postgresql.list
    state: absent
  tags: ["postgresql_install"]

- name: Ajout du dépôt APT pour PostgreSQL
  ansible.builtin.deb822_repository:
    name: postgresql
    types: deb
    signed_by: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    uris: http://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_distribution_release }}-pgdg"
    components:
      - main
    state: present
  notify: Update apt cache
  tags: ["postgresql_install"]

- name: Trigger handlers
  ansible.builtin.meta: flush_handlers

- name: Installation de PostgreSQL
  ansible.builtin.package:
    name:
      - postgresql-{{ postgresql_major_version }}
      - postgresql-client-{{ postgresql_major_version }}
      - python3-psycopg2
    state: present
  tags: ["postgresql_install"]
