- name: Installation de Valkey Sentinel
  ansible.builtin.package:
    name: valkey-sentinel
    state: present

- name: Création de la configuration dynamique
  ansible.builtin.template:
    src: sentinel.conf.j2
    dest: /etc/valkey/sentinel-neutrinet.conf
    owner: valkey
    group: valkey
    mode: "u=rw,go="
    force: false  # /!\ Ce fichier ne peux plus etre modifier une fois le cluster démarer, valkey modifie ce fichier pour indiquer la topologie du cluster
  notify: Restart Valkey Sentinel
  diff: false

- name: Création de la configuration static
  ansible.builtin.template:
    src: sentinel-static.conf.j2
    dest: /etc/valkey/sentinel-neutrinet-static.conf
    owner: valkey
    group: valkey
    mode: "u=r,go="
  notify: Restart Valkey Sentinel
  diff: false

- name: Création de la configuration ACL
  ansible.builtin.template:
    src: sentinel-acl.conf.j2
    dest: /etc/valkey/sentinel-neutrinet-acl.conf
    owner: valkey
    group: valkey
    mode: "u=r,go="
  notify: Restart Valkey Sentinel
  diff: false

- name: Dasactiver le serverValkey Sentinel par default
  ansible.builtin.service:
    name: valkey-sentinel.service
    state: stopped
    enabled: false

- name: Activation de Valkey Sentinel au démarrage
  ansible.builtin.service:
    name: valkey-sentinel@neutrinet.service
    state: started
    enabled: true

- name: Trigger sentinel handler
  ansible.builtin.meta: flush_handlers
