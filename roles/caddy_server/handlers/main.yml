- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Restart caddy
  ansible.builtin.service:
    name: caddy
    state: restarted

- name: Reload caddy
  ansible.builtin.service:
    name: caddy
    state: reloaded

- name: Restart vector
  ansible.builtin.service:
    name: vector
    state: restarted
