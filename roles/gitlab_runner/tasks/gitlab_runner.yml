- name: Suppression de l'ancien dépôt APT pour Gitlab Runner
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/gitlab-runner.list
    state: absent

- name: Ajout du dépôt APT pour Gitlab Runner
  ansible.builtin.deb822_repository:
    name: gitlab-runner
    types: deb
    signed_by: https://packages.gitlab.com/runner/gitlab-runner/gpgkey
    uris: https://packages.gitlab.com/runner/gitlab-runner/debian/
    suites: "{{ ansible_distribution_release | lower }}"
    components:
      - main
    state: present
  notify: Update apt cache

- name: Trigger handlers
  ansible.builtin.meta: flush_handlers

- name: Installation de Gitlab Runner
  ansible.builtin.package:
    name: gitlab-runner
    state: present

- name: Configuration de Gitlab Runner
  ansible.builtin.template:
    src: gitlab-runner/config.toml.j2
    dest: /etc/gitlab-runner/config.toml
    owner: root
    group: root
    mode: "u=rw,go="
  notify: Restart gitlab-runner
  tags: ['gitlab_runner_config']

- name: Activation de Gitlab Runner au démarrage
  ansible.builtin.service:
    name: gitlab-runner
    state: started
    enabled: true

- name: Trigger handlers
  # We need to restart gitlab-runner to apply the new config
  # and expose the metrics for telegraf
  ansible.builtin.meta: flush_handlers

- name: Configuration de vector
  ansible.builtin.template:
    src: vector/prometheus_gitlab_runner_exporter.yaml.j2
    dest: /etc/vector/sources/prometheus_gitlab_runner_exporter.yaml
    owner: vector
    group: vector
    mode: "ug=r,o="
  notify: Restart vector
  tags: ['vector_config']

- name: Configuration des backups Borgmatic
  ansible.builtin.template:
    src: borgmatic/gitlab-runner.yml.j2
    dest: /etc/borgmatic.d/gitlab-runner.yml
    owner: root
    group: root
    mode: "u=rw,go="
    validate: borgmatic config validate --show -c %s
  tags: ['borgmatic_config']
