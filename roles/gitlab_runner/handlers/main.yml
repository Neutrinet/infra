- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Restart docker
  ansible.builtin.service:
    name: docker
    state: restarted

- name: Restart gitlab-runner
  ansible.builtin.service:
    name: gitlab-runner
    state: restarted

- name: Restart vector
  ansible.builtin.service:
    name: vector
    state: restarted
