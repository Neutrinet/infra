---
- name: Installation de Caddy2
  ansible.builtin.import_role:
    name: caddy_server
  tags: ['caddy']

- name: Création de l'utilisateur {{ backoffice_owner }}
  ansible.builtin.user:
    name: "{{ backoffice_owner }}"
    home: "/var/www/{{ backoffice_owner }}"
    shell: /sbin/nologin
    system: true
    state: present

- name: Création du dossier /var/www
  ansible.builtin.file:
    path: /var/www
    owner: caddy
    group: caddy
    mode: "u=rwx,go=rx"
    state: directory

- name: Création du dossier racine du site
  ansible.builtin.file:
    path: "/var/www/{{ backoffice_owner }}/dist"
    owner: "{{ backoffice_owner }}"
    group: "{{ backoffice_owner }}"
    mode: "u=rwx,go=rx"
    state: directory

- name: Copie de la configuration Caddy2
  ansible.builtin.template:
    src: caddy/backoffice.j2
    dest: /etc/caddy/conf.d/{{ backoffice_owner }}.conf
    owner: root
    group: root
    mode: "u=rw,go=r"
    validate: caddy validate --adapter caddyfile --config %s
  notify: Reload caddy
  tags: ['caddy_config']

- name: Configuration de Caddy2 pour ffdnapi
  ansible.builtin.template:
    src: caddy/ffdnapi.j2
    dest: /etc/caddy/conf.d/{{ backoffice_ffdnapi_domain | replace('.', '-') }}.conf
    owner: root
    group: root
    mode: "u=rw,go=r"
    validate: caddy validate --adapter caddyfile --config %s
  notify: Reload caddy
  tags: ['caddy_config']

- name: Trigger Caddy handlers
  ansible.builtin.meta: flush_handlers

- name: Configuration de la base de données PostgreSQL
  ansible.builtin.import_role:
    name: postgres_db
  vars:
    postgresql_db_name: "{{ backoffice_owner }}"
    postgresql_db_password: "{{ backoffice_postgresql_password }}"
  tags: ['postgres']

- name: Installation de Backoffice
  ansible.builtin.import_tasks: backoffice.yml
  tags: ['backoffice']

- name: Configuration des backups Borgmatic
  ansible.builtin.template:
    src: borgmatic/backoffice.yml.j2
    dest: /etc/borgmatic.d/backoffice-{{ backoffice_owner }}.yml
    owner: root
    group: root
    mode: "u=rw,go="
    validate: borgmatic config validate --show -c %s
  vars:
    postgresql_db_name: "{{ backoffice_owner }}"
    postgresql_db_password: "{{ backoffice_postgresql_password }}"
  tags: ['borgmatic_config']
