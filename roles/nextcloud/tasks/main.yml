---
- name: Installation de Caddy2
  ansible.builtin.import_role:
    name: caddy_server
  tags: ['caddy']

- name: Installation de PHP FPM
  ansible.builtin.import_role:
    name: php_fpm
  vars:
    php_version: "{{ nextcloud_php_version }}"
    php_extra_modules:
      - apcu
      - bcmath
      - bz2
      - fileinfo
      - gmp
      - imagick
      - intl
      - pgsql
  tags: ['php_fpm']

- name: Création de l'utilisateur {{ nextcloud_owner }}
  ansible.builtin.user:
    name: "{{ nextcloud_owner }}"
    home: "/var/www/{{ nextcloud_owner }}"
    shell: /sbin/nologin
    system: true
    state: present

- name: Création du dossier /var/www
  ansible.builtin.file:
    path: /var/www
    owner: caddy
    group: caddy
    mode: "u=rwx,go=rx"
    state: directory

- name: Création du dossier racine du site
  ansible.builtin.file:
    path: "/var/www/{{ nextcloud_owner }}/dist"
    owner: "{{ nextcloud_owner }}"
    group: "{{ nextcloud_owner }}"
    mode: "u=rwx,go=rx"
    state: directory

- name: Création du dossier des logs Nextcloud
  ansible.builtin.file:
    path: "/var/log/nextcloud"
    owner: root
    group: root
    mode: "u=rwx,go=rx"
    state: directory

- name: Création du dossier des logs pour l'instance Nextcloud
  ansible.builtin.file:
    path: "/var/log/nextcloud/{{ nextcloud_owner }}"
    owner: "{{ nextcloud_owner }}"
    group: "{{ nextcloud_owner }}"
    mode: "u=rwx,go=rx"
    state: directory

- name: Configuration de logrotate
  ansible.builtin.template:
    src: logrotate/nextcloud.tpl
    dest: /etc/logrotate.d/nextcloud
    owner: root
    group: root
    mode: "u=rw,go=r"
    validate: logrotate --debug %s

- name: Copie de la configuration php-fpm
  ansible.builtin.template:
    src: php-fpm/php-pool.conf.j2
    dest: "/etc/php/{{ nextcloud_php_version }}/fpm/pool.d/{{ nextcloud_owner }}.conf"
    owner: root
    group: root
    mode: "u=rw,go=r"
  notify:
    - Reload php-fpm
  tags: ['php_config']

- name: Création du dossier tmp pour php-fpm
  ansible.builtin.file:
    path: "/var/www/{{ nextcloud_owner }}/tmp"
    owner: "{{ nextcloud_owner }}"
    group: "{{ nextcloud_owner }}"
    mode: "u=rwx,g=rx,o="
    state: directory

- name: Trigger php-fpm handlers
  ansible.builtin.meta: flush_handlers

- name: Copie de la configuration Caddy2
  ansible.builtin.template:
    src: "caddy/nextcloud.j2"
    dest: "/etc/caddy/conf.d/{{ nextcloud_owner }}.conf"
    owner: root
    group: root
    mode: "u=rw,go=r"
    validate: caddy validate --adapter caddyfile --config %s
  notify: Reload caddy
  tags: ['caddy_config']

- name: Trigger Caddy handlers
  ansible.builtin.meta: flush_handlers

- name: Configuration de la base de données PostgreSQL
  ansible.builtin.import_role:
    name: postgres_db
  vars:
    postgresql_db_name: "{{ nextcloud_owner }}"
    postgresql_db_password: "{{ nextcloud_postgresql_password }}"
  tags: ['postgres']

- name: Configuration des backups Borgmatic
  ansible.builtin.template:
    src: borgmatic/nextcloud.yml.j2
    dest: /etc/borgmatic.d/nextcloud-{{ nextcloud_owner }}.yml
    owner: root
    group: root
    mode: "u=rw,go="
    validate: borgmatic config validate --show -c %s
  vars:
    postgresql_db_name: "{{ nextcloud_owner }}"
    postgresql_db_password: "{{ nextcloud_postgresql_password }}"
  tags: ['borgmatic_config']

- name: Installation de rclone pour les backups du stockage S3
  ansible.builtin.import_role:
    name: rclone
  vars:
    rclone_src_host: "{{ nextcloud_s3_host }}"
    rclone_src_bucket: "{{ nextcloud_s3_bucket }}"
    rclone_src_access_key: "{{ nextcloud_s3_access_key }}"
    rclone_src_secret_key: "{{ nextcloud_s3_secret_key }}"
  when: nextcloud_s3_enabled
  tags: ['rclone']
