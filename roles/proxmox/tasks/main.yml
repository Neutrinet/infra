---
- name: Installation de Ceph
  ansible.builtin.import_role:
    name: ceph
  tags: ["ceph"]

- name: Installation de ipmitool
  ansible.builtin.package:
    name: ipmitool

- name: Suppression de l'ancien dépôt APT pour Proxmox
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-install-repo.list
    state: absent

- name: Ajout du dépôt APT pour Proxmox
  ansible.builtin.deb822_repository:
    name: pve-install-repo
    types: deb
    signed_by: "{{ proxmox_gpg_key_url }}"
    uris: http://download.proxmox.com/debian/pve
    suites: "{{ ansible_distribution_release }}"
    components:
      - pve-no-subscription
    state: present
  notify: Update apt cache

- name: Trigger handlers
  ansible.builtin.meta: flush_handlers

- name: Configuration de l'exporteur InfluxDB de Proxmox
  # The copy module doesn't work because /etc/pve is a special device
  # See also: https://github.com/ansible/ansible/issues/70535
  # Although it didn't work even with unsafe_writes=true in Ansible 2.11.5
  ansible.builtin.shell:
    cmd: |
      cat > /etc/pve/status.cfg << EOF
      influxdb: InfluxDB
      server 127.0.0.1
      port 8089
      EFO
    creates: /etc/pve/status.cfg

- name: Ajout de l'utilisateur telegraf au sudoers
  ansible.builtin.user:
    name: telegraf
    groups: disk
    append: true
  notify: Restart telegraf
  tags: ["telegraf_config"]

- name: Permission à l'utilisateur d'exécuter certaines commandes sudo
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    state: present
    regexp: "^telegraf"
    line: "telegraf ALL=(ALL) NOPASSWD: /usr/sbin/smartctl, /usr/bin/ipmitool"
    validate: "visudo -cf %s"
  tags: ["sudo"]

- name: Installation des plugins Telegraf
  ansible.builtin.template:
    src: telegraf/proxmox.conf.j2
    dest: /etc/telegraf/telegraf.d/proxmox.conf
    owner: telegraf
    group: telegraf
    mode: "u=rw,g=r,o="
    validate: telegraf --config %s --test
  notify: Restart telegraf
  tags: ["telegraf_config"]

- name: Configuration des backups Borgmatic
  ansible.builtin.template:
    src: borgmatic/proxmox.yml.j2
    dest: /etc/borgmatic.d/proxmox.yml
    owner: root
    group: root
    mode: "u=rw,go="
    validate: borgmatic config validate --show -c %s
  tags: ["borgmatic_config"]
