---
- name: pf_mcast | Déploiement du script d'abonnement multicast du PF
  ansible.builtin.copy:
    src: neutrinet_pf_mcast.py
    dest: /usr/local/sbin/neutrinet-pf-mcast
    owner: root
    group: root
    mode: u=rwx,go=rx
  notify: Restart neutrinet-pf-mcast

- name: pf_mcast | Création du dossier de configuration
  ansible.builtin.file:
    path: /etc/neutrinet
    state: directory
    owner: root
    group: root
    mode: u=rwx,go=rx

- name: pf_mcast | Déploiement de la liste des adresses portées par les VF
  ansible.builtin.template:
    src: neutrinet/pf-mcast-addresses.j2
    dest: /etc/neutrinet/pf-mcast-addresses
    owner: root
    group: root
    mode: u=r,go=r
  notify: Restart neutrinet-pf-mcast

- name: pf_mcast | Déploiement de l'unit systemd
  ansible.builtin.template:
    src: systemd/neutrinet-pf-mcast.service.j2
    dest: /etc/systemd/system/neutrinet-pf-mcast.service
    owner: root
    group: root
    mode: u=r,go=r
  notify: Restart neutrinet-pf-mcast

- name: pf_mcast | Activation du service
  ansible.builtin.systemd_service:
    name: neutrinet-pf-mcast
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
