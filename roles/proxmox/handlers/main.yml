- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Restart neutrinet-pf-mcast
  ansible.builtin.systemd_service:
    name: neutrinet-pf-mcast
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart vector
  ansible.builtin.service:
    name: vector
    state: restarted
