---

- name: Configuration de la base de données PostgreSQL
  ansible.builtin.import_role:
    name: postgres_db
  vars:
    postgresql_db_name: "{{ authentik_postgresql_database }}"
    postgresql_db_password: "{{ authentik_postgresql_password }}"

- name: Création de dossiers pour Authentik
  ansible.builtin.file:
    path: "{{ item }}"
    owner: 1000
    group: 1000
    mode: "u=rwX,g=rX,o="
    state: directory
  loop:
    - /opt/authentik
    - /opt/authentik/media
    - /opt/authentik/templates
    - /opt/authentik/static
    - /opt/authentik/certs

- name: Copie de nos images
  ansible.builtin.copy:
    src: "static/{{ item }}"
    dest: "/opt/authentik/static/{{ item }}"
    owner: 1000
    group: 1000
    mode: "ug=r,o="
  loop:
    - flow_background.jpg
    - icon_left_brand.svg
    - icon_left_brand.png
    - icon.png

- name: Créer les variables d'environnement
  ansible.builtin.template:
    src: authentik.env.j2
    dest: /etc/default/authentik
    owner: root
    group: root
    mode: 'ug=r,o='
  notify:
    - Restart authentik

- name: Supprimer les anciens services systemd Docker
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service"
    state: absent
  loop:
    - authentik-server
    - authentik-worker
  notify:
    - Restart authentik

- name: Créer les quadlets Podman
  ansible.builtin.template:
    src: "containers/{{ item }}.container.j2"
    dest: "/etc/containers/systemd/{{ item }}.container"
    owner: root
    group: root
    mode: 'ugo=r'
  loop:
    - authentik-server
    - authentik-worker
  notify:
    - Restart authentik
