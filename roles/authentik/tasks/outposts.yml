---
- name: outposts | Liste des outposts à déployer et à retirer
  ansible.builtin.set_fact:
    _authentik_outposts: "{{ authentik_outposts | selectattr('state', 'equalto', 'present') | list }}"
    _authentik_outposts_absent: "{{ authentik_outposts | selectattr('state', 'equalto', 'absent') | list }}"

- name: outposts | Variables d'environnement des outposts
  ansible.builtin.template:
    src: authentik-outpost.env.j2
    dest: "/etc/default/authentik-{{ item.name }}"
    owner: root
    group: root
    mode: "u=r,go="
  loop: "{{ _authentik_outposts }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Restart authentik outposts

- name: outposts | Quadlets Podman des outposts
  ansible.builtin.template:
    src: "containers/authentik-{{ item.name }}.container.j2"
    dest: "/etc/containers/systemd/authentik-{{ item.name }}.container"
    owner: root
    group: root
    mode: "ugo=r"
  loop: "{{ _authentik_outposts }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Restart authentik outposts

- name: outposts | Démarrage des outposts
  ansible.builtin.systemd_service:
    name: "authentik-{{ item.name }}"
    state: started
    daemon_reload: true
  loop: "{{ _authentik_outposts }}"
  loop_control:
    label: "{{ item.name }}"

- name: outposts | Liste des services présents
  ansible.builtin.service_facts:

- name: outposts | Arrêt des outposts retirés
  ansible.builtin.systemd_service:
    name: "authentik-{{ item.name }}"
    state: stopped
  loop: "{{ _authentik_outposts_absent }}"
  loop_control:
    label: "{{ item.name }}"
  when: ('authentik-' ~ item.name ~ '.service') in ansible_facts.services

- name: outposts | Suppression des quadlets des outposts retirés
  ansible.builtin.file:
    path: "/etc/containers/systemd/authentik-{{ item.name }}.container"
    state: absent
  loop: "{{ _authentik_outposts_absent }}"
  loop_control:
    label: "{{ item.name }}"

- name: outposts | Suppression des variables d'environnement des outposts retirés
  ansible.builtin.file:
    path: "/etc/default/authentik-{{ item.name }}"
    state: absent
  loop: "{{ _authentik_outposts_absent }}"
  loop_control:
    label: "{{ item.name }}"
