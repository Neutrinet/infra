---
- name: blueprints | Création du dossier des blueprints
  ansible.builtin.file:
    path: /opt/authentik/blueprints
    owner: 1000
    group: 1000
    mode: "u=rwx,g=rx,o="
    state: directory

- name: blueprints | Composition de la liste des pseudos interdits
  ansible.builtin.set_fact:
    _authentik_username_blocklist: >-
      {{ (lookup('ansible.builtin.file', 'username_blocklist.txt').splitlines() + authentik_username_blocklist)
        | select('match', '^[a-z0-9_-]+$') | unique | sort }}

- name: blueprints | Copie des modèles d'e-mail
  ansible.builtin.copy:
    src: email/neutrinet/
    dest: /opt/authentik/templates/neutrinet/
    owner: 1000
    group: 1000
    mode: "u=rwX,g=rX,o="
    directory_mode: "u=rwx,g=rx,o="
  notify:
    - Restart authentik

- name: blueprints | Déploiement des blueprints
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/opt/authentik/blueprints/{{ item | basename | regex_replace('\\.j2$', '') }}"
    owner: 1000
    group: 1000
    mode: "ug=r,o="
  loop: "{{ query('ansible.builtin.fileglob', role_path ~ '/templates/blueprints/*.yaml.j2') | sort }}"
  loop_control:
    label: "{{ item | basename }}"
