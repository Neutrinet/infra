---

- name: Installation de podman
  ansible.builtin.package:
    name: podman
    state: present
  tags: ['podman']

- name: Désactiver le socket Podman
  ansible.builtin.service:
    name: podman.socket
    state: stopped
    enabled: false

- name: Créer le répertoire des quadlets
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: 'u=rwx,go=rx'

- name: Installation de authentik
  ansible.builtin.import_tasks:
    file: authentik.yml
  tags: ['authentik']

- name: Déploiement des blueprints
  ansible.builtin.import_tasks:
    file: blueprints.yml
  tags: ['authentik', 'authentik_blueprints']

- name: Téléchargement des icônes des applications
  ansible.builtin.import_tasks:
    file: icons.yml
  tags: ['authentik', 'authentik_icons']

- name: Installation des outposts
  ansible.builtin.import_tasks:
    file: outposts.yml
  tags: ['authentik', 'authentik_outposts']

- name: Configuration des backup
  ansible.builtin.import_tasks:
    file: backup.yml
  tags: ['backup']

- name: Nettoyage des anciennes images
  ansible.builtin.import_tasks:
    file: cleanup.yml
  tags: ['cleanup']
