    nl: "Deze gebruikersnaam is gereserveerd."
    de: "Dieser Anmeldename ist reserviert."
  msg_username_taken:
    en: "This username is already taken. Choose another one."
    fr: "Ce nom d'utilisateur est déjà pris. Choisis-en un autre."
    nl: "Deze gebruikersnaam is al in gebruik. Kies een andere."
    de: "Dieser Anmeldename ist bereits vergeben. Wähle einen anderen."
  msg_username_red_format:
    en: "An administration account username must end with -admin, preceded by 3 to 26 characters: lowercase letters, digits, - and _, starting with a letter or a digit."
    fr: "Le nom d'utilisateur d'un compte d'administration doit finir par -admin, précédé de 3 à 26 caractères : lettres minuscules, chiffres, - et _, en commençant par une lettre ou un chiffre."
    nl: "De gebruikersnaam van een beheeraccount moet eindigen op -admin, met daarvoor 3 tot 26 tekens: kleine letters, cijfers, - en _, beginnend met een letter of cijfer."
    de: "Der Anmeldename eines Administrationskontos muss auf -admin enden, davor 3 bis 26 Zeichen: Kleinbuchstaben, Ziffern, - und _, beginnend mit einem Buchstaben oder einer Ziffer."
  msg_email_taken:
    en: "This email address is already used by another account. If it is yours, use \"Forgot username or password?\" on the sign-in page."
    fr: "Cette adresse courriel est déjà utilisée par un autre compte. Si c'est le tien, utilise « Mot de passe ou nom d'utilisateur oublié ? » sur la page de connexion."
    nl: "Dit e-mailadres wordt al door een ander account gebruikt. Is het van jou? Gebruik dan \"Gebruikersnaam of wachtwoord vergeten?\" op de aanmeldpagina."
    de: "Diese E-Mail-Adresse wird bereits von einem anderen Konto verwendet. Wenn es deins ist, nutze „Benutzername oder Passwort vergessen?“ auf der Anmeldeseite."
  msg_password_length:
    en: "The password must be at least 12 characters long."
    fr: "Le mot de passe doit faire au moins 12 caractères."
    nl: "Het wachtwoord moet minstens 12 tekens lang zijn."
    de: "Das Passwort muss mindestens 12 Zeichen lang sein."
  msg_deny:
    en: "Access denied. If you think this is a mistake, write to support@neutrinet.be."
    fr: "Accès refusé. Si tu penses que c'est une erreur, écris à support@neutrinet.be."
    nl: "Toegang geweigerd. Denk je dat dit een vergissing is? Schrijf naar support@neutrinet.be."
    de: "Zugriff verweigert. Wenn du denkst, dass das ein Fehler ist, schreib an support@neutrinet.be."
  msg_deny_reputation:
    en: "Too many failed attempts from your connection. Try again later (in 24 hours at the latest), or reset your password."
    fr: "Trop de tentatives échouées depuis ta connexion. Réessaie plus tard (dans 24 heures au plus tard), ou réinitialise ton mot de passe."
    nl: "Te veel mislukte pogingen vanaf je verbinding. Probeer het later opnieuw (uiterlijk over 24 uur), of stel je wachtwoord opnieuw in."
    de: "Zu viele fehlgeschlagene Versuche von deiner Verbindung. Versuche es später erneut (spätestens in 24 Stunden) oder setze dein Passwort zurück."
