    fr: "Le nom d'utilisateur d'un compte d'administration doit être <nom d'utilisateur>-admin, 32 caractères au plus."
    nl: "De gebruikersnaam van een beheeraccount moet <gebruikersnaam>-admin zijn, maximaal 32 tekens."
    de: "Der Anmeldename eines Administrationskontos muss <anmeldename>-admin lauten, höchstens 32 Zeichen."
  msg_email_taken:
    en: "This email address is already used by another account. If it is yours, use \"Forgot username or password?\" on the sign-in page."
    fr: "Cette adresse courriel est déjà utilisée par un autre compte. Si c'est le tien, utilise « Mot de passe ou nom d'utilisateur oublié ? » sur la page de connexion."
    nl: "Dit e-mailadres wordt al door een ander account gebruikt. Is het van jou? Gebruik dan \"Gebruikersnaam of wachtwoord vergeten?\" op de aanmeldpagina."
