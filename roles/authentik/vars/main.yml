  username:
    en: "Username"
    fr: "Nom d'utilisateur"
    nl: "Gebruikersnaam"
    de: "Anmeldename"
  username_help:
    en: "3 to 32 characters: lowercase letters, digits, - and _, starting with a letter or a digit, not ending with -admin."
    fr: "3 à 32 caractères : lettres minuscules, chiffres, - et _, en commençant par une lettre ou un chiffre, sans finir par -admin."
    nl: "3 tot 32 tekens: kleine letters, cijfers, - en _, beginnend met een letter of cijfer, niet eindigend op -admin."
    de: "3 bis 32 Zeichen: Kleinbuchstaben, Ziffern, - und _, beginnend mit einem Buchstaben oder einer Ziffer, nicht auf -admin endend."
  username_red_help:
    en: "It must end with -admin (for example alice-admin). Before -admin: 3 to 26 characters, lowercase letters, digits, - and _, starting with a letter or a digit."
    fr: "Il doit finir par -admin (par exemple alice-admin). Avant -admin : 3 à 26 caractères, lettres minuscules, chiffres, - et _, en commençant par une lettre ou un chiffre."
    nl: "De naam moet eindigen op -admin (bijvoorbeeld alice-admin). Vóór -admin: 3 tot 26 tekens, kleine letters, cijfers, - en _, beginnend met een letter of cijfer."
    de: "Er muss auf -admin enden (zum Beispiel alice-admin). Vor -admin: 3 bis 26 Zeichen, Kleinbuchstaben, Ziffern, - und _, beginnend mit einem Buchstaben oder einer Ziffer."
  username_settings_help:
    en: "To change your username, write to support@neutrinet.be."
    fr: "Pour changer de nom d'utilisateur, écris à support@neutrinet.be."
    nl: "Om je gebruikersnaam te wijzigen, schrijf naar support@neutrinet.be."
    de: "Um deinen Anmeldenamen zu ändern, schreib an support@neutrinet.be."
  name:
