    fr: "Bonjour {username},\n\nL'adresse e-mail de ton compte Neutrinet ID vient d'être remplacée par {new}.\n\nSi tu n'es pas à l'origine de ce changement, écris immédiatement à support@neutrinet.be.\n"
    nl: "Hallo {username},\n\nHet e-mailadres van je Neutrinet ID-account is zojuist vervangen door {new}.\n\nAls jij deze wijziging niet hebt gedaan, schrijf dan onmiddellijk naar support@neutrinet.be.\n"
    de: "Hallo {username},\n\ndie E-Mail-Adresse deines Neutrinet-ID-Kontos wurde soeben durch {new} ersetzt.\n\nWenn du diese Änderung nicht vorgenommen hast, schreib sofort an support@neutrinet.be.\n"
