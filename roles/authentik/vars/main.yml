    en: "Usernames ending in -admin are reserved for administration accounts."
    fr: "Les pseudos finissant par -admin sont réservés aux comptes d'administration."
    nl: "Gebruikersnamen die eindigen op -admin zijn voorbehouden aan beheeraccounts."
    de: "Benutzernamen, die auf -admin enden, sind Administrationskonten vorbehalten."
  msg_username_reserved:
    en: "This username is reserved."
    fr: "Ce pseudo est réservé."
    nl: "Deze gebruikersnaam is gereserveerd."
    de: "Dieser Benutzername ist reserviert."
  msg_username_red_format:
    en: "An administration account username must be <username>-admin, 32 characters at most."
    fr: "Le pseudo d'un compte d'administration doit être <pseudo>-admin, 32 caractères au plus."
    nl: "De gebruikersnaam van een beheeraccount moet <gebruikersnaam>-admin zijn, maximaal 32 tekens."
    de: "Der Benutzername eines Administrationskontos muss <benutzername>-admin lauten, höchstens 32 Zeichen."
  msg_email_taken:
    en: "This email address is already used by another account."
    fr: "Cette adresse e-mail est déjà utilisée par un autre compte."
    nl: "Dit e-mailadres wordt al door een ander account gebruikt."
    de: "Diese E-Mail-Adresse wird bereits von einem anderen Konto verwendet."
  msg_password_length:
    en: "The password must be at least 12 characters long."
    fr: "Le mot de passe doit faire au moins 12 caractères."
    nl: "Het wachtwoord moet minstens 12 tekens lang zijn."
    de: "Das Passwort muss mindestens 12 Zeichen lang sein."
  mail_email_changed_subject:
    en: "Neutrinet: email address changed"
    fr: "Neutrinet : adresse e-mail modifiée"
    nl: "Neutrinet: e-mailadres gewijzigd"
    de: "Neutrinet: E-Mail-Adresse geändert"
  mail_email_changed_body:
    en: "Hello {username},\n\nThe email address of your Neutrinet account has just been replaced by {new}.\n\nIf you did not make this change, write immediately to support@neutrinet.be.\n"
    fr: "Bonjour {username},\n\nL'adresse e-mail de ton compte Neutrinet vient d'être remplacée par {new}.\n\nSi tu n'es pas à l'origine de ce changement, écris immédiatement à support@neutrinet.be.\n"
    nl: "Hallo {username},\n\nHet e-mailadres van je Neutrinet-account is zojuist vervangen door {new}.\n\nAls jij deze wijziging niet hebt gedaan, schrijf dan onmiddellijk naar support@neutrinet.be.\n"
    de: "Hallo {username},\n\ndie E-Mail-Adresse deines Neutrinet-Kontos wurde soeben durch {new} ersetzt.\n\nWenn du diese Änderung nicht vorgenommen hast, schreib sofort an support@neutrinet.be.\n"
