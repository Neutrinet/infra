  msg_username_format:
    en: "The username must be 3 to 32 characters long: lowercase letters, digits, - and _, starting with a letter or a digit."
    fr: "Le nom d'utilisateur doit faire de 3 à 32 caractères : lettres minuscules, chiffres, - et _, en commençant par une lettre ou un chiffre."
    nl: "De gebruikersnaam moet 3 tot 32 tekens lang zijn: kleine letters, cijfers, - en _, beginnend met een letter of cijfer."
    de: "Der Anmeldename muss 3 bis 32 Zeichen lang sein: Kleinbuchstaben, Ziffern, - und _, beginnend mit einem Buchstaben oder einer Ziffer."
  msg_username_admin_suffix:
    en: "Usernames ending in -admin are reserved for administration accounts."
    fr: "Les noms d'utilisateur finissant par -admin sont réservés aux comptes d'administration."
    nl: "Gebruikersnamen die eindigen op -admin zijn voorbehouden aan beheeraccounts."
    de: "Anmeldenamen, die auf -admin enden, sind Administrationskonten vorbehalten."
