    fr: "Adresse courriel"
    nl: "E-mailadres"
    de: "E-Mail-Adresse"
  email_red_help:
    en: "It must differ from the address of your usual account."
    fr: "Elle doit être différente de celle de ton compte habituel."
    nl: "Het moet verschillen van het adres van je gewone account."
    de: "Sie muss sich von der Adresse deines normalen Kontos unterscheiden."
  red_pending_notice:
    en: "Your administration account has been created. It is waiting for validation by a member of the administration team, who will contact you through another channel to verify your identity. You can close this page."
    fr: "Ton compte d'administration a été créé. Il attend la validation d'un membre de l'équipe d'administration, qui te contactera par un autre canal pour vérifier ton identité. Tu peux fermer cette page."
    nl: "Je beheeraccount is aangemaakt. Het wacht op goedkeuring door een lid van het beheerteam, dat via een ander kanaal contact met je opneemt om je identiteit te controleren. Je kunt deze pagina sluiten."
    de: "Dein Administrationskonto wurde erstellt. Es wartet auf die Freigabe durch ein Mitglied des Administrationsteams, das dich über einen anderen Kanal kontaktiert, um deine Identität zu prüfen. Du kannst diese Seite schließen."
