    en: "The username must be 3 to 32 characters long: lowercase letters, digits, - and _, starting with a letter or a digit."
    fr: "Le pseudo doit faire de 3 à 32 caractères : lettres minuscules, chiffres, - et _, en commençant par une lettre ou un chiffre."
