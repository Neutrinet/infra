- name: Copie des alertes
  ansible.builtin.template:
    src: rules/{{ rule_group }}.yml.j2
    dest: /etc/victoriametrics/rules.d/{{ rule_group }}.yml
    owner: root
    group: root
    mode: "u=rw,go=r"
    validate: vmalert -dryRun -rule %s
  loop:
    - base
    - vpn
    - patroni
    - caddy
    - haproxy
    - ceph
    - bgp
    - ppp
    - monitoring
    - x509
    - postgresql
  loop_control:
    loop_var: rule_group
  notify: Reload victoriametrics-alert

- name: Suppression des anciennes alertes hardware, fusionnées dans base
  ansible.builtin.file:
    path: /etc/victoriametrics/rules.d/hardware.yml
    state: absent
  notify: Reload victoriametrics-alert
