---
- name: Verify
  hosts: all
  become: true

  tasks:
    - name: Récupération de l'état des services
      ansible.builtin.service_facts:

    - name: Vérification que alertmanager est actif et activé au démarrage
      ansible.builtin.assert:
        that:
          - ansible_facts.services['alertmanager.service'].state == 'running'
          - ansible_facts.services['alertmanager.service'].status == 'enabled'

    - name: Vérification que victoriametrics-alert est actif et activé au démarrage
      ansible.builtin.assert:
        that:
          - ansible_facts.services['victoriametrics-alert.service'].state == 'running'
          - ansible_facts.services['victoriametrics-alert.service'].status == 'enabled'

    - name: Vérification de http://localhost:9093/-/ready
      ansible.builtin.uri:
        url: http://localhost:9093/-/ready
        return_content: true
      register: _verify_endpoint_0
      retries: 6
      delay: 10
      until: "_verify_endpoint_0.status == 200 and 'OK' in _verify_endpoint_0.content"

    - name: Vérification de http://localhost:8880/api/v1/rules
      ansible.builtin.uri:
        url: http://localhost:8880/api/v1/rules
        return_content: true
      register: _verify_endpoint_1
      retries: 6
      delay: 10
      until: "_verify_endpoint_1.status == 200 and 'Instance Down' in _verify_endpoint_1.content"
