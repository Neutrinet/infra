dependency:
  name: galaxy
driver:
  name: vagrant
  provider:
    name: libvirt
platforms:
  - name: trixie-alertmanager-molecule
    box: debian/trixie64
    # Groupes de l'inventaire de production utilisés par les règles d'alerte
    groups:
      - louise
      - proxmox
      - proxmox_patata
      - pbs
    cpu: 2
    memory: 1024
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: /usr/bin/python3
      roles_path: "${MOLECULE_PROJECT_DIRECTORY}/.."
      vault_password_file: "${MOLECULE_PROJECT_DIRECTORY}/../../vault.key"
    ssh_connection:
      pipelining: true
verifier:
  name: ansible
