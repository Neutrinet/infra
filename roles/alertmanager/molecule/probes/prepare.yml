---
- name: Prepare Probes
  hosts: probe
  become: true

  pre_tasks:
    - name: Mise à jour du cache APT
      ansible.builtin.apt:
        update_cache: true

  roles:
    - vector
    - blackbox_exporter

- name: Prepare Alertmanager
  hosts: alertmanager
  become: true

  pre_tasks:
    - name: Mise à jour du cache APT
      ansible.builtin.apt:
        update_cache: true

    - name: Installation de Git
      ansible.builtin.package:
        name: git
        state: present

    - name: Installation des ACL
      ansible.builtin.package:
        name: acl
        state: present

  roles:
    - borgmatic
    - victoriametrics

  post_tasks:
    - name: Installation de socat
      ansible.builtin.package:
        name: socat
        state: present

    - name: Relais vers VictoriaMetrics pour les sondes, à la place de HAProxy
      ansible.builtin.copy:
        content: |
          [Service]
          ExecStart=/usr/bin/socat TCP6-LISTEN:8428,fork,reuseaddr TCP6:[::1]:8428
        dest: /etc/systemd/system/victoriametrics-relay.service
        owner: root
        group: root
        mode: "u=rw,go=r"

    - name: Démarrage du relais vers VictoriaMetrics
      ansible.builtin.systemd_service:
        name: victoriametrics-relay
        state: started
        daemon_reload: true
