---
- name: Installation de KeyDB
  ansible.builtin.import_tasks: keydb.yml
  tags: ['keydb']

- name: Installation de Redis exporter
  ansible.builtin.include_role:
    name: redis_exporter
  tags: ['redis_exporter']

- name: Configuration des backups Borgmatic
  ansible.builtin.template:
    src: borgmatic/keydb.yml.j2
    dest: /etc/borgmatic.d/keydb.yml
    owner: root
    group: root
    mode: "u=rw,go="
    validate: borgmatic config validate --show -c %s
  tags: ['borgmatic_config']
