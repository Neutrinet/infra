---

- name: Config réseau via sysctl
  ansible.builtin.import_tasks: sysctl.yml
  tags: ['bird']

- name: Installation de bird3
  ansible.builtin.import_tasks: install.yml
  tags: ['bird', 'bird_install']

- name: Configuration de bird3
  ansible.builtin.import_tasks: config.yml
  tags: ['bird', 'bird_config']

- name: Activation du service bird
  ansible.builtin.import_tasks: service.yml
  tags: ['bird', 'bird_config']

- name: Configuration de bird_exporter
  ansible.builtin.import_role:
    name: bird_exporter
  tags: ['bird_exporter']

- name: Configuration des backups Borgmatic
  ansible.builtin.template:
    src: borgmatic/bird.yml.j2
    dest: /etc/borgmatic.d/bird.yml
    owner: root
    group: root
    mode: "u=r,go="
    validate: /opt/borgmatic/bin/validate-borgmatic-config -c %s
  tags: ['borgmatic_config']
