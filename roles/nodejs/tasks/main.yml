---
- name: Suppression de l'ancien dépôt APT pour NodeJS
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nodejs.list
    state: absent

- name: Ajout du dépôt APT pour NodeJS
  ansible.builtin.deb822_repository:
    name: nodejs
    types: deb
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    uris: https://deb.nodesource.com/node_{{ nodejs_major_version }}.x
    suites: nodistro
    components:
      - main
    state: present
  notify: Update apt cache

- name: Trigger handlers
  ansible.builtin.meta: flush_handlers

- name: Installation de NodeJS
  ansible.builtin.package:
    name: nodejs
    state: present
