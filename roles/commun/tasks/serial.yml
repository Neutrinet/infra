---
- name: serial | Créer le dossier de drop-in grub
  ansible.builtin.file:
    path: /etc/default/grub.d
    state: directory
    owner: root
    group: root
    mode: "u=rwx,go=rx"

- name: serial | Déployer la config serial de grub
  ansible.builtin.template:
    src: grub_serial.cfg.j2
    dest: /etc/default/grub.d/serial.cfg
    owner: root
    group: root
    mode: "ugo=r"
  notify: Update grub

- name: serial | Déclencher les handlers grub
  ansible.builtin.meta: flush_handlers
