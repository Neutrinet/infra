---
- name: Installation des ACL
  ansible.builtin.package:
    name: acl
    state: present
  tags: ["routinator_install"]

- name: Ajout du dépôt APT pour Routinator
  ansible.builtin.deb822_repository:
    name: routinator
    types: deb
    signed_by: https://packages.nlnetlabs.nl/aptkey.asc
    uris: https://packages.nlnetlabs.nl/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components:
      - main
    state: present
  notify: Update apt cache

- name: Trigger handlers
  ansible.builtin.meta: flush_handlers

- name: Installation de routinator
  ansible.builtin.package:
    name: routinator
    state: present
  tags: ["routinator_install"]

- name: Déploiement des ROA locaux, servis à la place des données des RIR
  ansible.builtin.copy:
    content: >-
      {{ {'slurmVersion': 1,
          'validationOutputFilters': {'prefixFilters': [], 'bgpsecFilters': []},
          'locallyAddedAssertions': {'prefixAssertions': routinator_local_roas, 'bgpsecAssertions': []}} | to_nice_json }}
    dest: /etc/routinator/local-roas.json
    owner: routinator
    group: routinator
    mode: "ug=r,o="
  when: routinator_local_roas | length > 0
  notify: Restart routinator
  tags: ["routinator_config"]

- name: Configuration de routinator
  ansible.builtin.template:
    src: routinator.conf.j2
    dest: /etc/routinator/routinator.conf
    owner: routinator
    group: routinator
    mode: "ug=r,o="
    validate: routinator --config %s config
  notify: Restart routinator
  tags: ["routinator_config"]

- name: Activation du service routinator au démarage
  ansible.builtin.service:
    name: routinator
    state: started
    enabled: true
  tags: ["routinator_config"]
