---
- name: Verify
  hosts: all
  become: true

  tasks:
    - name: Récupération de l'état des services
      ansible.builtin.service_facts:

    # service_facts ne donne pas l'état d'activation des instances d'une unité template
    - name: Récupération du lien d'activation de php-fpm-exporter@molecule
      ansible.builtin.stat:
        path: /etc/systemd/system/multi-user.target.wants/php-fpm-exporter@molecule.service
      register: _verify_enabled

    - name: Vérification que php-fpm-exporter@molecule est actif et activé au démarrage
      ansible.builtin.assert:
        that:
          - ansible_facts.services['php-fpm-exporter@molecule.service'].state == 'running'
          - _verify_enabled.stat.exists

    - name: Vérification que l'exporter lit le pool
      ansible.builtin.uri:
        url: http://localhost:9253/metrics
        return_content: true
      register: _verify_endpoint
      retries: 6
      delay: 10
      until: "_verify_endpoint.status == 200 and 'phpfpm_up{pool=\"molecule\"' in _verify_endpoint.content"

    - name: Vérification que le pool est joignable
      ansible.builtin.assert:
        that:
          - "_verify_endpoint.content is search('phpfpm_up[{][^}]*[}] 1')"

    - name: Vérification des métriques remontées par Vector
      ansible.builtin.uri:
        url: http://localhost:9598/metrics
        return_content: true
      register: _verify_vector
      retries: 12
      delay: 10
      until: "_verify_vector.status == 200 and 'phpfpm_up' in _verify_vector.content"
