---
- name: Installation de GPG
  ansible.builtin.package:
    name:
      - gpg
      - gpg-agent
      - dirmngr
    state: present

- name: Création du répertoire pour les clés GPG
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "u=rwx,go=rx"

- name: Suppression de l'ancien dépôt APT pour Telegraf
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/telegraf.list
    state: absent

- name: Ajout du dépôt APT pour Telegraf
  ansible.builtin.deb822_repository:
    name: telegraf
    types: deb
    signed_by: https://repos.influxdata.com/influxdata-archive.key
    uris: https://repos.influxdata.com/debian
    suites: stable
    components:
      - main
    state: present
  notify: Update apt cache

- name: Trigger handlers
  ansible.builtin.meta: flush_handlers

- name: Installation de Telegraf
  ansible.builtin.package:
    name: telegraf
    state: present

- name: Copie des plugins globaux de Telegraf
  ansible.builtin.template:
    src: telegraf/global.conf.j2
    dest: /etc/telegraf/telegraf.d/global.conf
    owner: telegraf
    group: telegraf
    mode: "u=rw,g=r,o="
    validate: telegraf --config %s --test
  notify: Restart telegraf
  tags: ['telegraf_config']

- name: Désactivation de la sortie influxdb
  ansible.builtin.lineinfile:
    path: /etc/telegraf/telegraf.conf
    regexp: '^\[\[outputs\.influxdb\]\]'
    line: '# [[outputs.influxdb]]'
    validate: telegraf --config %s --test
  notify: Restart telegraf

- name: Activation de Telegraf au démarrage
  ansible.builtin.service:
    name: telegraf
    state: started
    enabled: true
