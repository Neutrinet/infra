---

- name: install | Installation de snmpd et des dépendances des scripts LibreNMS
  ansible.builtin.apt:
    name:
      - snmpd
      - libjson-perl
      - libfile-slurp-perl
    state: present

- name: install | Autorisation de birdc en lecture seule pour Debian-snmp
  community.general.sudoers:
    name: snmpd-birdc
    user: Debian-snmp
    runas: bird
    commands: /usr/sbin/birdc -r show protocols all
    nopassword: true
    state: present
