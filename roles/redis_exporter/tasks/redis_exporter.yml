---

- name: redis_exporter | Création de l'utilisateur pour Redis exporter
  ansible.builtin.user:
    name: redis-exporter
    home: /opt/redis-exporter
    shell: /sbin/nologin
    system: true
    create_home: false
    state: present

- name: redis_exporter | Création des dossiers de Redis exporter
  ansible.builtin.file:
    path: "{{ redis_exporter_dir }}"
    owner: redis-exporter
    group: redis-exporter
    mode: "u=rwx,go=rx"
    state: directory
  loop:
    - /opt/redis-exporter
    - /opt/redis-exporter/{{ redis_exporter_version }}
  loop_control:
    loop_var: redis_exporter_dir

- name: redis_exporter | Création du dossier des archives de Redis exporter
  ansible.builtin.file:
    path: /usr/local/src/redis-exporter
    owner: root
    group: root
    mode: "u=rwx,g=rx,o="
    state: directory

- name: redis_exporter | Téléchargement de l'archive de Redis exporter v{{ redis_exporter_version }}
  ansible.builtin.get_url:
    url: https://github.com/oliver006/redis_exporter/releases/download/v{{ redis_exporter_version }}/redis_exporter-v{{ redis_exporter_version }}.linux-amd64.tar.gz
    dest: /usr/local/src/redis-exporter/{{ redis_exporter_version }}.tar.gz
    owner: root
    group: root
    mode: "u=rw,go=r"
    checksum: "sha256:https://github.com/oliver006/redis_exporter/releases/download/v{{ redis_exporter_version }}/sha256sums.txt"

- name: redis_exporter | Décompression de l'archive
  ansible.builtin.unarchive:
    src: /usr/local/src/redis-exporter/{{ redis_exporter_version }}.tar.gz
    dest: /opt/redis-exporter/{{ redis_exporter_version }}
    creates: /opt/redis-exporter/{{ redis_exporter_version }}/redis_exporter
    remote_src: true
    extra_opts:
      - --strip-components=1
    owner: redis-exporter
    group: redis-exporter

- name: redis_exporter | Création du lien symbolique pour le binaire de Redis exporter
  ansible.builtin.file:
    src: /opt/redis-exporter/{{ redis_exporter_version }}/redis_exporter
    dest: /usr/local/bin/redis-exporter
    state: link
  notify: Restart redis-exporter

- name: redis_exporter | Configuration du service systemd
  ansible.builtin.template:
    src: systemd/redis-exporter.service.j2
    dest: /etc/systemd/system/redis-exporter.service
    owner: root
    group: root
    mode: "ugo=r"
  notify: Restart redis-exporter

- name: redis_exporter | Activation de Redis exporter au démarrage
  ansible.builtin.systemd:
    name: redis-exporter
    state: started
    enabled: true
    daemon_reload: true

- name: redis_exporter | Trigger handlers
  ansible.builtin.meta: flush_handlers
