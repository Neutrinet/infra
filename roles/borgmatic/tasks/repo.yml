- name: Génération de la clé SSH pour le serveur de backup {{ repo.host }}
  community.crypto.openssh_keypair:
    path: "/root/.ssh/{{ repo.host | replace('.', '-') }}"
    type: ed25519
    comment: root@{{ ansible_fqdn }}

- name: Récupération de la clé publique du client SSH
  ansible.builtin.slurp:
    path: /root/.ssh/{{ repo.host | replace('.', '-') }}.pub
  register: _borgmatic_ssh_public_key

- name: Création de l'utilisateur {{ repo.user }} sur le serveur de backup {{ repo.host }}
  ansible.builtin.user:
    name: "{{ repo.user }}"
    password: '*'
    home: "{{ repo.path }}"
    shell: /bin/bash
    state: present
  delegate_to: "{{ repo.host }}"
  run_once: true

- name: Ajout de la clé publique du client SSH sur le serveur de backup {{ repo.host }}
  ansible.posix.authorized_key:
    user: "{{ repo.user }}"
    key: "{{ _borgmatic_ssh_public_key.content | b64decode }}"
    key_options: command="borg serve --restrict-to-path {{ repo.path }}/{{ inventory_hostname | replace('.', '-') }}",restrict
  delegate_to: "{{ repo.host }}"
  throttle: 1

- name: Création du dossier des données sur le serveur de backup {{ repo.host }}
  ansible.builtin.file:
    path: "{{ repo.path }}/{{ inventory_hostname | replace('.', '-') }}"
    state: directory
    owner: "{{ repo.user }}"
    group: "{{ repo.user }}"
    mode: u=rwx,go=
  delegate_to: "{{ repo.host }}"

- name: Configuration du client SSH pour le serveur de backup {{ repo.host }}
  ansible.builtin.blockinfile:
    path: /root/.ssh/config
    state: present
    create: true
    owner: root
    group: root
    mode: u=rw,go=
    block: |
      Host {{ repo.host }}
      User {{ repo.user }}
      IdentityFile /root/.ssh/{{ repo.host | replace('.', '-') }}
      PreferredAuthentications publickey,password
    marker: "# {mark} ANSIBLE MANAGED BLOCK {{ repo.host }}"

- name: Résolution DNS de {{ repo.host }} (IPv4 et IPv6)
  ansible.builtin.set_fact:
    _borgmatic_repo_targets: "{{ ([repo.host,
        lookup('community.general.dig', repo.host, 'qtype=A'),
        lookup('community.general.dig', repo.host, 'qtype=AAAA')]
      | reject('equalto', 'NXDOMAIN')
      | reject('equalto', '')
      | list) }}"

- name: Scan de la clé publique du serveur de backup {{ repo.host }}
  ansible.builtin.command: ssh-keyscan {{ repo.host }}
  changed_when: false
  register: _borgmatic_repo_host_ssh_keyscan
  run_once: true
  when: repo.ssh_known_hosts | default([]) | length == 0

- name: Ajout de {{ repo.host }} et de ses IPs dans la liste des serveurs connus
  ansible.builtin.known_hosts:
    name: "{{ host_target }}"
    key: "{{ _borgmatic_repo_host_ssh_keyscan.stdout }}"
    path: /root/.ssh/known_hosts
    hash_host: false
    state: present
  loop: "{{ _borgmatic_repo_targets }}"
  loop_control:
    loop_var: host_target
  when: repo.ssh_known_hosts | default([]) | length == 0

- name: Ajout de {{ repo.host }} et de ses IPs dans la liste des serveurs connus
  ansible.builtin.known_hosts:
    name: "{{ host_target }}"
    key: "{{ host_target }} {{ host_key }}"
    path: /root/.ssh/known_hosts
    hash_host: false
    state: present
  loop: "{{ _borgmatic_repo_targets | product(repo.ssh_known_hosts) | list }}"
  loop_control:
    loop_var: _borgmatic_repo_entry
    label: "{{ host_target }} {{ host_key }}"
  vars:
    host_target: "{{ _borgmatic_repo_entry.0 }}"
    host_key: "{{ _borgmatic_repo_entry.1 }}"
  when: repo.ssh_known_hosts | default([]) | length > 0
